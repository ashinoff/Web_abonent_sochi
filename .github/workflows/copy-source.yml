name: Copy Web_abonent to Sochi repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Copy original project files to Sochi
        shell: bash
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch main https://github.com/ashinoff/Web_abonent.git /tmp/web-abonent-source
          git clone --depth=1 --branch main "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/web-abonent-sochi
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/web-abonent-source/ /tmp/web-abonent-sochi/
          cd /tmp/web-abonent-sochi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Project already copied'
          else
            git commit -m 'Import Web_abonent source files for Sochi'
            git push origin main
          fi
